name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Verify formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Static check
        run: make lint

      - name: Run tests
        run: make test
